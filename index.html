<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    
    const addFormNameEl = document.querySelector('.add-form-name');
    const addFormTextEl = document.querySelector('.add-form-text');
    const addFormButtonEl = document.querySelector('.add-form-button');
    const commentsEl = document.querySelector('.comments');

    let userName = '';
    let userComment = '';

    const comments = [
      {
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likes: 3,
        isLiked: false,
      },

      {
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likes: 75,
        isLiked: true,
      },
    ];

    addFormNameEl.addEventListener('input', () => {
      userName = addFormNameEl.value;
    });

    addFormTextEl.addEventListener('input', () => {
      userComment = addFormTextEl.value;
    });

    function getCurrentDate() {
      const currentDate = new Date();

      const day = String(currentDate.getDate()).padStart(2, '0');
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const year = String(currentDate.getFullYear()).slice(-2);
      const hours = String(currentDate.getHours()).padStart(2, '0');
      const minutes = String(currentDate.getMinutes()).padStart(2, '0');

      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function initLikeListeners() {
      const likeButtons = document.querySelectorAll('.like-button');

      likeButtons.forEach((likeButton) => {
        likeButton.addEventListener('click', (event) => {
          event.stopPropagation();

          const commentIndex = Number(likeButton.dataset.index);
          const comment = comments[commentIndex];

          if (comment.isLiked) {
            comment.likes -= 1;
            comment.isLiked = false;
          } else {
            comment.likes += 1;
            comment.isLiked = true;
          }

          renderComments();
        });
      });
    }

    function initCommentListeners() {
      const commentElements = document.querySelectorAll('.comment');

      commentElements.forEach((commentElement) => {
        commentElement.addEventListener('click', () => {
          const commentIndex = Number(commentElement.dataset.index);
          const comment = comments[commentIndex];

          const quote = `> ${comment.name}: ${comment.text}\n\n`;

          addFormTextEl.value = quote;
          userComment = quote;

          addFormTextEl.focus();
        });
      });
    }

    function formatCommentText(text) {
      if (!text.startsWith('>')) {
        return escapeHtml(text);
      }

      const textParts = text.split('\n\n');
      const quote = textParts[0];
      const answer = textParts.slice(1).join('\n\n');

      return `
        <blockquote class='comment-quote'>
          ${escapeHtml(quote)}
        </blockquote>

        <div class='comment-answer'>
          ${escapeHtml(answer)}
        </div>
      `;
    }

    function renderComments() {
      const newComment = comments
      .map((comment, index) => {
        return `
        <li class="comment" data-index="${index}">
          <div class="comment-header">
            <div>${escapeHtml(comment.name)}</div>
            <div>${comment.date}</div>
          </div>

          <div class="comment-body">
            <div class="comment-text">
              ${formatCommentText(comment.text)}
            </div>
          </div>

          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${comment.isLiked ? "-active-like" : ""}" data-index="${index}"></button>
            </div>
          </div>
        </li>
      `;})
      .join('');

      commentsEl.innerHTML = newComment;

      initLikeListeners();
      initCommentListeners();      
    }

    addFormButtonEl.addEventListener('click', () => {
      if (userName.trim() === '' || userComment.trim() === '') {
        alert('Введите имя и комментарий');
        return;
      }

      const newComment = {
        name: userName,
        date: getCurrentDate(),
        text: userComment,
        likes: 0,
        isLiked: false,
      };

      comments.push(newComment);

      renderComments();

      addFormNameEl.value = '';
      addFormTextEl.value = '';

      userName = '';
      userComment = '';
    });

    renderComments();

    console.log("It works!");
  </script>
</html>
