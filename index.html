<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    const addFormNameEl = document.querySelector('.add-form-name');
    const addFormTextEl = document.querySelector('.add-form-text');
    const addFormButtonEl = document.querySelector('.add-form-button');
    const commentsEl = document.querySelector('.comments');

    let userName = '';
    let userText = '';

    addFormNameEl.addEventListener('input', () => {
      userName = addFormNameEl.value;
    });

    addFormTextEl.addEventListener('input', () => {
      userText = addFormTextEl.value;
    });

    addFormButtonEl.addEventListener('click', () => {
      if (userName.trim() === '' || userText.trim() === '') {
        alert('Введите имя и комментарий');
        return;
      }

      const currentDate = new Date();

      const day = String(currentDate.getDate()).padStart(2, "0");
      const month = String(currentDate.getMonth() + 1).padStart(2, "0");
      const year = String(currentDate.getFullYear()).slice(-2);
      const hours = String(currentDate.getHours()).padStart(2, "0");
      const minutes = String(currentDate.getMinutes()).padStart(2, "0");

      const formattedDate = `${day}.${month}.${year} ${hours}:${minutes}`;

      const newComment = `
        <li class="comment">
          <div class="comment-header">
            <div>${userName}</div>
            <div>${formattedDate}</div>
          </div>

          <div class="comment-body">
            <div class="comment-text">
              ${userText}
            </div>
          </div>

          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
      `;

      commentsEl.innerHTML += newComment;

      addFormNameEl.value = '';
      addFormTextEl.value = '';

      userName = '';
      userText = '';
    })

    console.log("It works!");
  </script>
</html>
